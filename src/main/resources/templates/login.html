<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Kodewala Academy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            --blue: #1A237E;
            --dark-blue: #0D1B3E;
            --yellow: #FBC02D;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--dark-blue), var(--blue));
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }
        .form-control {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 12px 20px;
            border-radius: 12px;
        }
        .form-control:focus {
            background: rgba(255, 255, 255, 0.12);
            border-color: var(--yellow);
            color: white;
            box-shadow: none;
        }
        .btn-login {
            background: var(--yellow);
            color: var(--dark-blue);
            font-weight: 800;
            border-radius: 12px;
            padding: 14px;
            border: none;
            width: 100%;
            margin-top: 20px;
            transition: 0.3s;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(251, 192, 45, 0.3);
            background: #fbc02d;
        }
        .logo-small {
            font-weight: 900;
            color: var(--yellow);
            letter-spacing: 2px;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <div class="login-card text-center">
        <i class="bi bi-shield-lock-fill" style="font-size: 50px; color: var(--yellow);"></i>
        <h2 class="logo-small mt-3">KODEWALA</h2>
        <p class="text-white-50 mb-5">Admin Portal Access</p>

        <form action="/login" method="post">
            <div class="mb-3 text-start">
                <label class="form-label text-white-50 small">Admin ID</label>
                <input type="text" name="adminId" class="form-control" placeholder="Enter Admin ID" required>
            </div>
            <div class="mb-4 text-start">
                <label class="form-label text-white-50 small">Password</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-login">LOGIN TO PORTAL</button>
        </form>

        <div th:if="${error}" class="mt-3 text-danger small">
            <i class="bi bi-exclamation-circle me-1"></i> <span th:text="${error}"></span>
        </div>
    </div>
</body>
</html>
